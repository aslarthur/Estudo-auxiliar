<!DOCTYPE html>
<html lang="pt-br">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mídias em HTML5</title>
    </head>
    <body>
        <h1>Imagem dinámica</h1>
        <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
        <picture>
            <source media="(max-width: 750px)" srcset="imagens/P.png" type="image/png"> <!--Se a largura for até 750px = Mostra a imagem pequena-->
            <source media="(max-width: 1050px)" srcset="imagens/M.png" type="image/png"> <!--Se não, se a largura for de 751px até 1050px = Mostra a imagem média-->
            <img src="imagens/G.png" alt="Imagem flexíxivel"> <!--Se nenhuma das condições acima forem verdadeiras = mostra a imagem grande--> 
            <!--É basicamente um if, elif, else em python-->
        </picture>
        <h1>Reproduzindo aúdio</h1>
        <p>Vamos aprender a reproduzir aúdios em HTML5</p>
        <audio preload="metadata" controls loop>
            <source src="midia/back_to_black.mp3" type="audio/mpeg">
            <p>Infelizmente seu navegador não consegue reproduzir aúdio.</p>
            <a href="midia/back_to_black.mp3" download="back_to_black.mp3" type="application/mp3"> Clique aqui para baixar o link MP3</a>
        </audio>
</html>
